[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"

# Handle static files
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Handle JavaScript files
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"

# Handle CSS files
[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"

# Handle React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[build.processing]
  skip_processing = false 